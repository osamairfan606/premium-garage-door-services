name: Build and deploy

# Every push and pull request to main is built and checked.
# Deploys run only on main, only when the repository variable GODADDY_DEPLOY_ENABLED is "true",
# and each GitHub environment ("staging", then "production") should require a manual approval.
# See docs/deploy-godaddy.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (typecheck, client, SSR, prerender)
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://premiumdoorservices.com' }}
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT || '/api/quote.php' }}
          # Inject GA4 + GTM into the production HTML (see scripts/prerender.mjs).
          ENABLE_ANALYTICS: 'true'

      - name: Check build output
        run: |
          for f in index.html 404.html sitemap.xml robots.txt about.html about/index.html services/commercial/index.html api/quote.php llms.txt; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          ls dist/assets/*.js dist/assets/*.css > /dev/null
          # The build must never contain files that belong to WordPress.
          bad=$(cd dist && find . -maxdepth 1 \( -name '.htaccess' -o -name 'index.php' -o -name 'wp-*' -o -name 'xmlrpc.php' \) -print)
          [ -z "$bad" ] || { echo "::error::Build contains WordPress-reserved files: $bad"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14

  staging:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GODADDY_DEPLOY_ENABLED == 'true' && vars.GODADDY_STAGING_ENABLED == 'true'
    uses: ./.github/workflows/deploy-godaddy.yml
    with:
      environment: staging
    secrets: inherit

  # Runs after a successful staging deploy, or straight after the build when no staging site is configured.
  production:
    needs: [build, staging]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.staging.result == 'success' || needs.staging.result == 'skipped') &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.GODADDY_DEPLOY_ENABLED == 'true' && vars.GODADDY_PRODUCTION_ENABLED == 'true'
    uses: ./.github/workflows/deploy-godaddy.yml
    with:
      environment: production
    secrets: inherit
